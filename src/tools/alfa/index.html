<!DOCTYPE html>
<html lang="it" data-tool="alfa" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSP — nessuno schema http:/https: compare in questa policy: la suite non può
     caricare nulla dalla rete né spedire nulla fuori, e non è più solo una promessa
     del codice. 'unsafe-inline'/'unsafe-eval' servono perché i bundle sono file
     unici (tutto inlinato) e pdf.js/JSZip usano eval al proprio interno; la via
     d'esecuzione JS dei PDF ostili è chiusa alla fonte con isEvalSupported:false. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' file: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' file: data: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file: data: blob:; worker-src 'self' file: blob:; frame-src 'self' file: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>α Alfa — Centro di controllo dell'hub</title>
<!-- Design system condiviso: token + componenti; α tiene solo i propri specifici.
     Accento NEUTRO nero/bianco per tema (data-tool="alfa"), non un colore fisso:
     è il centro di controllo, fuori dalla palette "prodotto" degli altri tool. -->
<link rel="stylesheet" href="../../shared/ui/tokens.css">
<link rel="stylesheet" href="../../shared/ui/components.css">
<link rel="stylesheet" href="./styles/alfa.css">
</head>
<body>

<header class="ehb-hdr" data-tool="alfa">
  <div class="ehb-hdr__brand">
    <div class="ehb-logo" data-tool="alfa"><span class="ehb-logo__glyph"><svg class="ehb-glyph-svg" viewBox="0 -800 600 1000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M243 10Q160 10 110 -48.5Q60 -107 60 -205L60 -345Q60 -443 110 -501.5Q160 -560 243 -560Q311 -560 349 -520.5Q387 -481 387 -410L354 -445L389 -445L389 -550L534 -550L534 0L389 0L389 -105L354 -105L387 -140Q387 -69 349 -29.5Q311 10 243 10ZM297 -120Q338 -120 361 -143.5Q384 -167 384 -210L384 -340Q384 -383 361 -406.5Q338 -430 297 -430Q255 -430 232.5 -407Q210 -384 210 -340L210 -210Q210 -167 232.5 -143.5Q255 -120 297 -120Z" fill="currentColor"/></svg></span></div>
    <div class="ehb-hdr__brand-txt">
      <span class="ehb-hdr__brand-name"><span class="ehb-name-glyph"><svg class="ehb-glyph-svg" viewBox="0 -800 600 1000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M243 10Q160 10 110 -48.5Q60 -107 60 -205L60 -345Q60 -443 110 -501.5Q160 -560 243 -560Q311 -560 349 -520.5Q387 -481 387 -410L354 -445L389 -445L389 -550L534 -550L534 0L389 0L389 -105L354 -105L387 -140Q387 -69 349 -29.5Q311 10 243 10ZM297 -120Q338 -120 361 -143.5Q384 -167 384 -210L384 -340Q384 -383 361 -406.5Q338 -430 297 -430Q255 -430 232.5 -407Q210 -384 210 -340L210 -210Q210 -167 232.5 -143.5Q255 -120 297 -120Z" fill="currentColor"/></svg></span> Alfa</span>
      <span class="ehb-hdr__brand-sub">centro di controllo dell'hub</span>
    </div>
  </div>
  <nav class="ehb-tabs" role="tablist" aria-label="Viste α">
    <button id="aTabPanoramica" class="ehb-tab is-active" role="tab" aria-selected="true" onclick="showView('panoramica')">Panoramica</button>
    <button id="aTabUtenti" class="ehb-tab" role="tab" aria-selected="false" onclick="showView('utenti')">Utenti</button>
    <button id="aTabAzienda" class="ehb-tab" role="tab" aria-selected="false" onclick="showView('azienda')">Azienda</button>
    <button id="aTabBackup" class="ehb-tab" role="tab" aria-selected="false" onclick="showView('backup')">Backup</button>
  </nav>
  <div class="ehb-hdr__spacer"></div>
  <div class="ehb-hdr__actions">
    <button id="btnTheme" class="ehb-icon-btn" onclick="toggleTheme()" title="Cambia tema (chiaro/scuro) di questo tool">☀</button>
  </div>
</header>

<main id="app">

  <!-- Vista: PANORAMICA — statistiche live -->
  <section id="viewPanoramica" class="a-view">
    <div id="aStatsGrid" class="a-stats-grid"></div>
  </section>

  <!-- Vista: UTENTI -->
  <section id="viewUtenti" class="a-view" hidden>
    <div class="a-sec-head"><h2>Utenti</h2><span class="adm-sec-count" id="aUsersCount"></span></div>
    <p class="a-sec-lead">Gestione degli utenti aziendali: ruolo, attivazione, aggiunta e rimozione.</p>
    <div class="adm-users-bar">
      <input id="aUsersFilter" type="search" class="adm-users-filter" placeholder="Cerca utente…" autocomplete="off" oninput="filterUsers()">
    </div>
    <div class="adm-users" id="aUsers"></div>
  </section>

  <!-- Vista: AZIENDA -->
  <section id="viewAzienda" class="a-view" hidden>
    <div class="a-sec-head"><h2>Azienda</h2></div>
    <p class="a-sec-lead">Organizzazione gestita da questo centro di controllo.</p>
    <div id="aCompany"></div>
  </section>

  <!-- Vista: BACKUP -->
  <section id="viewBackup" class="a-view" hidden>
    <div class="a-sec-head"><h2>Backup / Ripristino</h2></div>
    <p class="a-sec-lead">Esporta o reimporta la configurazione (utenti e impostazioni) in un file.</p>
    <div class="adm-backup">
      <button type="button" class="ehb-btn ehb-btn--accent-soft" onclick="exportConfig()">Esporta configurazione</button>
      <button type="button" class="ehb-btn" onclick="importConfigClick()">Importa…</button>
      <button type="button" class="ehb-btn" onclick="exportDiagnostics()">Esporta report diagnostico</button>
      <input type="file" id="aConfigFile" accept=".json,application/json" hidden>
    </div>
  </section>

</main>

<div id="toast" class="ehb-toast"></div>

<script type="module" src="./main.js"></script>
</body>
</html>
