version: 2

# Le dipendenze npm qui sono tutte di SVILUPPO (build, test, packaging): non
# finiscono nell'app distribuita. Restano comunque codice che gira sulla macchina
# di chi contribuisce e nella CI, quindi vale tenerle aggiornate.
#
# Attenzione: le librerie che l'app spedisce davvero stanno in vendor/ come copie
# congelate (pdf.js, SheetJS, pdf-lib, fontkit, JSZip) e Dependabot NON le vede.
# Quelle si aggiornano a mano — versioni e licenze in NOTICE.md.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
