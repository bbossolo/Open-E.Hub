version: 2

# Le dipendenze npm qui sono tutte di SVILUPPO (build, test, packaging): non
# finiscono nell'app distribuita. Restano comunque codice che gira sulla macchina
# di chi contribuisce e nella CI, quindi vale tenerle aggiornate.
#
# Attenzione: le librerie che l'app spedisce davvero stanno in vendor/ come copie
# congelate (pdf.js, SheetJS, pdf-lib, fontkit, JSZip) e Dependabot NON le vede.
# Quelle si aggiornano a mano — versioni e licenze in NOTICE.md.
#
# Raggruppate SOLO le versioni minori e di manutenzione: quelle arrivano in una
# PR sola, che se la CI è verde si merge senza pensarci. I cambi di versione
# MAGGIORE restano fuori dal gruppo e ottengono una PR ciascuno: sono quelli che
# tolgono opzioni e cambiano API, e vanno guardati uno per uno (il primo giro ne
# aveva accorpati sei, e la CI l'ha giustamente bocciato).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      manutenzione:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      manutenzione:
        patterns: ["*"]
        update-types: ["minor", "patch"]
