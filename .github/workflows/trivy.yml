name: Trivy Security Scan

# Scansione di sicurezza mensile con Trivy sull'intera repository:
# vulnerabilità nelle dipendenze (npm), segreti e misconfigurazioni.
# Gira il 1° di ogni mese alle 06:00 UTC; lanciabile anche a mano.
# Risultati: tabella nel log del run + report JSON completo come artifact.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (tabella nel log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Run Trivy (report JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload report artifact
        # Best-effort: se la quota artifact dell'account è piena l'upload
        # fallisce, ma i risultati restano comunque leggibili nel log.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 90
